

<div class="page-wrapper">
  <div class="main-content">
    <!-- HEADER -->
    <mat-toolbar color="primary" class="header-toolbar">
      <span class="logo" routerLink="/dashboard/home"><mat-icon>menu_book</mat-icon> Bookstore</span>
      <div class="search-wrapper">
        <div class="search-bar">
          <mat-icon>search</mat-icon>
          <input type="text" [(ngModel)]="searchQuery" (input)="searchBooks()" placeholder="Search" />
        </div>
      </div>
      <div class="header-buttons">
       

        
      

         <div class="profile-wrapper">
  <button class="icon-button" (click)="toggleProfileCard()">
    <mat-icon class="person">person</mat-icon>
  </button>
   

  <div class="profile-card" *ngIf="showProfileCard">
    <div class="menu-header">
      <h3>Hello {{ firstname }},</h3>
    </div>

    <div class="menu-item"  (click)="goToOrders()">
      <mat-icon>shopping_bag</mat-icon>
      <span>My Orders</span>
    </div>
    <div class="menu-item"  (click)="goToWishlist()">
      <mat-icon>favorite_border</mat-icon>
      <span>My Wishlist</span>
    </div>

    <div class="logout-button"  (click)=" OnLogout()">
      Logout
    </div>
  </div>
</div>



      
    
<button
  mat-icon-button
  class="icon-button white-badge"
  disableRipple
  [matBadge]="cartCount"
  [matBadgeHidden]="cartCount === 0"
  matBadgeColor="warn"
  matBadgeOverlap="false"
  routerLink="/dashboard/cart">
  <mat-icon>shopping_cart</mat-icon>
</button>

      </div>
    </mat-toolbar>



  <router-outlet></router-outlet>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <span>© 2025, Bookstore Private Limited. All Rights Reserved</span>
    </div>
  </footer>
</div>
