



      <!-- HEADER -->
      <mat-toolbar color="primary" class="header-toolbar">
        <span class="logo" ><mat-icon>menu_book</mat-icon> Bookstore</span>
      
       
      </mat-toolbar>

<div class="forgot-password-container">
    <h2>Forgot Your Password?</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    
    <form class="reset-form" [formGroup]="forgotForm">
      <label for="email" id="emailtext">Email Id</label>
      <input type="email" id="email" placeholder="Enter your email" required  formControlName="email"/>
      
      <button type="submit" class="reset-btn" (click)="ForgotPassword()">Reset Password</button>
    </form>
  
    <div class="create-account">
      <a href="#" routerLink="/registerlogin">CREATE ACCOUNT</a>
    </div>
  </div>
